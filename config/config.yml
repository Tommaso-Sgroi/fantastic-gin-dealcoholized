# Web API Configuration File
# Precedence used by the app:
#   defaults < YAML file < environment variables < command-line flags
#
# Note:
# - Keep values simple and explicit.
# - Lists are standard YAML arrays.

config:
  # Optional: path to another YAML file.
  # Usually set via CLI/env when needed.
  path: ""

web:
  # Public API bind address
  apihost: 0.0.0.0:3001

  # Debug/pprof bind address
  debughost: 0.0.0.0:4000

  # HTTP server timeouts
  readtimeout: 5s
  writetimeout: 5s
  shutdowntimeout: 5s

  # Gin trusted proxies (IP or CIDR).
  # Empty list means no trusted proxies.
  trustedproxies: []
  # Example:
  # trustedproxies:
  #   - 127.0.0.1
  #   - 10.0.0.0/8

logger:
  # One of: debug, info, warn, error
  level: debug

  # Use "stderr" or "stdout" for console logging, or provide a file path.
  file: stderr
  # file: /tmp/dealch.log

db:
  # SQLite file path used by cfg.DB.Filename in the app.
  filename: /tmp/dealch.db

cors:
  # If true, allows any origin. Do not combine with credentials in production.
  allowallorigins: false

  # Explicitly allowed origins when allowallorigins is false.
  allowedorigins:
    - http://localhost:3000
  # Example:
  # allowedorigins:
  #   - http://localhost:5173
  #   - https://app.example.com

  # Allowed HTTP methods for CORS preflight/actual requests.
  allowedmethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS

  # Allowed request headers from browser clients.
  allowedheaders: []
  # Example:
  # allowedheaders:
  #   - Authorization
  #   - Content-Type

  # Whether browsers may send cookies/auth headers cross-origin.
  allowcredentials: false

  # Preflight cache duration in seconds.
  # Mapped in code to time.Duration(maxage) * time.Second.
  maxage: 86400
